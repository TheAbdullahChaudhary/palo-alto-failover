[tool.poetry]
name = "palo-alto-failover"
version = "1.1.0"
description = "Dependencies for HIE PR Health Check"
authors = [">", "Philip Wortinger <philip.wortinger@mihin.org>"]

packages = [
    { include = "lambda_functions" }
]


[tool.poetry.dependencies]
python = "~3.13"
boto3 = "1.34.91"
defusedxml = "0.7.1"
requests = "2.31.0"
python-json-logger = "^3.2.1"
urllib3 = "1.26.18"

[tool.poetry.group.dev.dependencies]
flake8 = "6.1.0"
pytest = "^8.3.3"
coverage = {extras = ["toml"], version = "7.3.2"}
pytest-cov = "4.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-v --cov --cov-report term --cov-report xml"
log_cli = true
log_cli_level = "WARNING"
testpaths = [
    "lambda_functions/*/tests"
]

[tool.coverage.run]
branch = true
include = [
    "lambda_functions/*/src/*"
]
omit=[
    "*__init__*",
    "*/tests/*"
]

[tool.coverage.xml]
output = "coverage.xml"
